[package]
name = "lumen-bindgen"
description = "Build-time only: uniffi's binding generator (never linked into an app)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }
