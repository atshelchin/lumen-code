<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#07090d" />
		%sveltekit.head%
		<script>
			// Before anything is drawn: open the page in the language the visitor chose before.
			// Without a choice, only the English pages follow a Chinese browser (the Chinese pages
			// never send anyone away, so that crawlers can read them).
			(function () {
				try {
					var here = document.documentElement.lang.indexOf('zh') === 0 ? 'zh' : 'en';
					var want = localStorage.getItem('lumen.lang');
					if (
						!want &&
						here === 'en' &&
						(navigator.language || '').toLowerCase().indexOf('zh') === 0
					)
						want = 'zh';
					if (want && want !== here) {
						var other = document.querySelector(
							'link[rel="alternate"][hreflang="' + (want === 'zh' ? 'zh-CN' : 'en') + '"]'
						);
						if (other)
							location.replace(other.getAttribute('data-local') + location.search + location.hash);
					}
				} catch (e) {}
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<!-- traffic analytics; kept last so it never delays the app -->
		<script src="https://tj.appsdata.org/api/script.js" data-site-id="c474d69b2974" defer></script>
	</body>
</html>
