# XcodeGen spec for the iOS shell (`xcodegen` writes Lumen.xcodeproj; it is not committed).
# Build the Rust core first: scripts/build-core.sh. Or run scripts/run.sh to do everything.
name: Lumen
options:
  bundleIdPrefix: ltd.mondaylabs
  # English and Simplified Chinese (the core's languages); the .lproj folders in
  # Lumen/Resources localise the Info.plist strings (permission prompts, display name)
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: F9W689P9NE
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
packages:
  LumenCoreKit:
    path: LumenCoreKit
targets:
  Lumen:
    type: application
    platform: iOS
    sources:
      - path: Lumen
    dependencies:
      - package: LumenCoreKit
        product: LumenCore
    info:
      path: Lumen/Resources/Info.plist
      properties:
        CFBundleDisplayName: Lumen Code
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        # ProMotion iPhones: let the code's display link run at 120 Hz (a 60 fps sender)
        CADisableMinimumFrameDurationOnPhone: true
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # localised in Lumen/Resources/<lang>.lproj/InfoPlist.strings; keep the English in step
        NSCameraUsageDescription: Lumen Code uses the camera to read the colour code on the sender's screen. The picture never leaves your device.
        NSPhotoLibraryAddUsageDescription: When you tap Save on a received image, Lumen Code adds it to your photo library.
        LSSupportsOpeningDocumentsInPlace: false
        UIFileSharingEnabled: false
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Any file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.data
              - public.content
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ltd.mondaylabs.lumencode
        PRODUCT_NAME: Lumen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only: not offered on iPad, or as an iPhone app on Apple silicon Macs and Vision Pro
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_KEY_UIStatusBarHidden: false
schemes:
  Lumen:
    build:
      targets:
        Lumen: all
    run:
      config: Debug
    archive:
      config: Release
