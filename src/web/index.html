        <a class="choice recv" href="recv.html">

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2" /><circle cx="12" cy="12" r="3.2" /></svg>

      <p class="foot"><span data-i18n="privacy"></span> <span data-i18n="foot"></span></p>
    </main>
    <script type="module">
      import { applyI18n, toggleLang } from './js/i18n.js';
      import { Sender } from './js/core/transfer.js';
      import { Renderer } from './js/core/render.js';
      import { crc32 } from './js/core/util.js';

      applyI18n();
      document.getElementById('lang').onclick = toggleLang;

      // One real frame, drawn by the protocol library. It stays still: no flashing on this page.
      const text = new TextEncoder().encode('Lumen Code: files as moving light. '.repeat(40));
      const meta = { name: 'hello.txt', fileSize: text.length, crc: crc32(text), flags: 0, payloadLength: text.length };
      const tx = new Sender({ payload: text, meta }, { mode: 1, ecc: 1, X: 86, Y: 54, tid: 0x4c43 });
      tx.seq = 7;
      const { cells, layout } = tx.nextFrame();
      const r = new Renderer(layout, 1, 4);
      const canvas = document.getElementById('sample');
      canvas.width = r.width;
      canvas.height = r.height;
      const g = canvas.getContext('2d');
      const img = g.createImageData(r.width, r.height);
      r.draw(cells, new Uint32Array(img.data.buffer));
      g.putImageData(img, 0, 0);
    </script>
    <!-- traffic analytics; kept last so it never delays the app -->
    <script src="https://tj.appsdata.org/api/script.js" data-site-id="c474d69b2974" defer></script>
  </body>
