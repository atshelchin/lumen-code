    <script type="module">
      import { applyI18n, toggleLang, currentLang } from './js/i18n.js?v=c839a7fac2';
      // the guides exist in both languages; link the one matching the page
      const guide = document.querySelector('a[data-i18n="guideLink"]');
      const sync = () => (guide.href = currentLang() === 'zh' ? 'docs/guide/README.zh-CN.md' : 'docs/guide/README.md');
      applyI18n();
      sync();
      document.getElementById('lang').onclick = () => {
        toggleLang();
        sync();
